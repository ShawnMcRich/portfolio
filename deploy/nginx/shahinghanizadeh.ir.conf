server {
    listen 80;
    listen [::]:80;

    server_name shahinghanizadeh.ir www.shahinghanizadeh.ir;

    return 301 https://shahinghanizadeh.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.shahinghanizadeh.ir;

    ssl_certificate /etc/letsencrypt/live/shahinghanizadeh.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shahinghanizadeh.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://shahinghanizadeh.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name shahinghanizadeh.ir;

    ssl_certificate /etc/letsencrypt/live/shahinghanizadeh.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shahinghanizadeh.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/shahinghanizadeh.ir/current;
    index index.html;

    location / {
        try_files $uri.html $uri $uri/ =404;
    }

    location /_next/static/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
